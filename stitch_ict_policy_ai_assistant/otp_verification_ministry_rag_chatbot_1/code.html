<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .otp-input:focus {
            outline: none;
            border-color: #023464;

            background: rgba(255, 255, 255, 0.8);

<body class="flex flex-col min-h-screen text-on-surface">
<!-- Hero Background Animation -->
<div class="fixed inset-0 -z-10 overflow-hidden">

</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-page-margin-mobile md:px-page-margin-desktop py-12">
<div class="w-full max-w-md">
<!-- Branding / Top Anchor -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-white mb-6 shadow-lg">
<span class="material-symbols-outlined text-headline-xl" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight">Identity Verification</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-2 px-6">
                    We've sent a 6-digit secure code to your registered mobile number ending in <span class="font-semibold text-on-surface">•••• 4829</span>.
                </p>
</div>
<!-- OTP Card -->
<div class="glass-panel rounded-xl p-8 shadow-sm">
<form class="space-y-8" id="otp-form">
<!-- OTP Inputs -->
<div class="flex justify-between gap-2 md:gap-3" id="otp-container">
<input autofocus="" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-bold bg-surface-container-low border border-surface-border rounded-lg transition-all" maxlength="1" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-bold bg-surface-container-low border border-surface-border rounded-lg transition-all" maxlength="1" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-bold bg-surface-container-low border border-surface-border rounded-lg transition-all" maxlength="1" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-bold bg-surface-container-low border border-surface-border rounded-lg transition-all" maxlength="1" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-bold bg-surface-container-low border border-surface-border rounded-lg transition-all" maxlength="1" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-bold bg-surface-container-low border border-surface-border rounded-lg transition-all" maxlength="1" type="text">
</div>
<!-- Timer and Resend -->
<div class="flex flex-col items-center gap-4">
<div class="flex items-center gap-2 text-label-md font-label-md text-on-surface-variant" id="timer-container">
<span class="material-symbols-outlined text-sm">schedule</span>
<span>Resend code in <span class="font-bold text-primary" id="timer">00:59</span></span>
</div>
<button class="text-label-md font-label-md text-outline hover:text-primary transition-colors cursor-not-allowed opacity-50" id="resend-btn" type="button" disabled="">
                            Resend Code
                        </button>
</div>
<!-- Action -->
<button class="w-full h-12 bg-primary hover:bg-primary-container text-white font-semibold rounded-lg shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                        Verify Identity
                    </button>
</form>
</div>
<!-- Footer Help Text -->
<div class="mt-8 text-center">
<p class="text-label-sm font-label-sm text-on-surface-variant">
                    Having trouble? <a class="text-secondary font-bold hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
</main>
<!-- Success Toast (Hidden by default) -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-4 bg-white border border-surface-border px-6 py-4 rounded-xl shadow-xl transform translate-y-24 opacity-0 transition-all duration-500 ease-out z-50" id="success-toast">
<div class="w-10 h-10 rounded-full bg-success-green/10 flex items-center justify-center text-success-green">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<p class="text-label-md font-bold text-on-surface">Verification Successful</p>
<p class="text-label-sm text-on-surface-variant">Redirecting to Ministry Portal...</p>
</div>
</div>
<!-- Notification Toast (Example) -->
<div class="fixed top-8 right-8 z-50">
<div class="glass-panel p-4 rounded-lg flex items-center gap-3 border-l-4 border-secondary-container animate-bounce">
<span class="material-symbols-outlined text-secondary-container">info</span>
<span class="text-label-md text-on-surface">Code sent successfully.</span>
</div>
</div>
<!-- Scripting for Interactivity -->
<script>
        // OTP Focus Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Countdown Timer Logic
        let timeLeft = 59;
        const timerDisplay = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.parentElement.classList.add('hidden');
                resendBtn.disabled = false;
                resendBtn.classList.remove('cursor-not-allowed', 'opacity-50', 'text-outline');
                resendBtn.classList.add('text-secondary', 'font-bold');
            } else {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);

        // Verification Logic Mock
        const form = document.getElementById('otp-form');
        const toast = document.getElementById('success-toast');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate API call
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                // Mock redirect
                window.location.reload();
            }, 3000);
        });
    </script>
